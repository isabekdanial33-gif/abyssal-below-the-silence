name: macOS build
on:
  push:
    branches: [mac-build]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Icon
        run: |
          mkdir icon.iconset
          for s in 16 32 128 256; do
            sips -z $s $s electron/icon.png --out icon.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) electron/icon.png --out icon.iconset/icon_${s}x${s}@2x.png
          done
          sips -z 512 512 electron/icon.png --out icon.iconset/icon_512x512.png
          iconutil -c icns icon.iconset -o electron/icon.icns
      - run: node tools/package-mac.cjs ${{ matrix.arch }} 1.0.5
      - name: Sign (ad-hoc) and zip
        run: |
          APP="release/ABYSSAL-darwin-${{ matrix.arch }}/ABYSSAL.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/ABYSSAL"
          mkdir out && cp -R "$APP" out/
          cp "КАК ЗАПУСТИТЬ.txt" out/
          cd out && ditto -c -k --sequesterRsrc . ../ABYSSAL-mac-${{ matrix.arch }}.zip
          ls -la ../ABYSSAL-mac-${{ matrix.arch }}.zip
      - name: Smoke test
        if: matrix.arch == 'arm64'
        run: |
          "release/ABYSSAL-darwin-arm64/ABYSSAL.app/Contents/MacOS/ABYSSAL" > log.txt 2>&1 &
          PID=$!
          sleep 25
          screencapture -x shot.png || true
          if kill -0 $PID; then echo "ALIVE after 25s"; kill $PID; else echo "DIED"; cat log.txt; exit 1; fi
          cat log.txt
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: shot
          path: shot.png
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.0 ABYSSAL-mac-${{ matrix.arch }}.zip --clobber --repo ${{ github.repository }}
